
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>muadongincheon</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100vh;width:100vw;font-family:'Plus Jakarta Sans',sans-serif;background:#030303;color:#fff;overflow:hidden}

    .bg-canvas{position:fixed;inset:0;z-index:0;background:#050507;overflow:hidden}
    .bg-glow{position:absolute;width:450px;height:450px;background:radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, rgba(59, 130, 246, 0.15) 40%, transparent 70%);border-radius:50%;filter:blur(60px);animation:floatGlow 10s infinite alternate ease-in-out}
    .bg-glow-2{position:absolute;right:-50px;bottom:-50px;width:400px;height:400px;background:radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, transparent 70%);border-radius:50%;filter:blur(70px)}

    @keyframes floatGlow{
      0%{transform:translate(-30px,-30px) scale(1)}
      100%{transform:translate(40px,50px) scale(1.25)}
    }

    .intro-screen{position:fixed;inset:0;background:#050507;display:flex;justify-content:center;align-items:center;z-index:100;transition:opacity .6s cubic-bezier(0.16,1,0.3,1),visibility .6s ease}
    .intro-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
    
    .intro-text{
      font-size:24px;
      font-weight:800;
      color:#fff;
      cursor:pointer;
      letter-spacing:2px;
      text-transform:uppercase;
      padding: 16px 40px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      backdrop-filter: blur(20px);
      box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.9),
        0 0 20px rgba(255, 255, 255, 0.6),
        0 0 30px rgba(255, 255, 255, 0.4);
    }

    .viewport{position:relative;z-index:1;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto}
    .container{width:100%;max-width:480px;display:none;flex-direction:column;gap:14px;animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1)}

    @keyframes slideUp{
      from{opacity:0;transform:translateY(25px)}
      to{opacity:1;transform:translateY(0)}
    }

    .glass-card{
      background:linear-gradient(135deg, rgba(30, 30, 38, 0.55), rgba(15, 15, 20, 0.35));
      border:1px solid rgba(255, 255, 255, 0.12);
      border-radius:26px;
      padding:20px 22px;
      backdrop-filter:blur(30px) saturate(200%);
      -webkit-backdrop-filter:blur(30px) saturate(200%);
      box-shadow:
        0 20px 50px rgba(0,0,0,0.6),
        inset 0 1px 1px rgba(255,255,255,0.2),
        inset 0 -1px 1px rgba(0,0,0,0.4);
    }

    .profile-card{display:flex;flex-direction:column;gap:14px;position:relative}
    .profile-top{display:flex;justify-content:space-between;align-items:flex-start}
    
    .profile-info{display:flex;flex-direction:column;gap:6px}
    .profile-name{font-size:22px;font-weight:800;letter-spacing:-0.3px;color:#fff;display:flex;align-items:center;gap:2px}
    
    .typing-cursor{display:inline-block;width:2px;height:20px;background:#fff;animation:blinkCursor 0.8s infinite;margin-left:2px;vertical-align:middle}
    @keyframes blinkCursor{0%,100%{opacity:1}50%{opacity:0}}

    .bio-text{font-size:14px;color:rgba(255,255,255,0.75);margin-top:4px;line-height:1.5}

    .avatar-box{position:relative;width:82px;height:82px;flex-shrink:0}
    .avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.25);box-shadow:0 8px 20px rgba(0,0,0,0.5)}
    
    .social-row{display:flex;gap:12px;margin-top:4px}
    .social-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.12);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:17px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
      transition:all 0.2s ease;
    }
    .social-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.18)}
    .social-btn.ig:hover{color:#e1306c;border-color:rgba(225,48,108,0.5);box-shadow:0 0 15px rgba(225,48,108,0.3)}
    .social-btn.tt:hover{color:#fe2c55;border-color:rgba(254,44,85,0.5);box-shadow:0 0 15px rgba(254,44,85,0.3)}
    .social-btn.fb:hover{color:#1877f2;border-color:rgba(24,119,242,0.5);box-shadow:0 0 15px rgba(24,119,242,0.3)}

    .badge-card{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
    .badge-left{display:flex;align-items:center;gap:14px}
    .badge-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}
    .badge-details{display:flex;flex-direction:column}
    .badge-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
    .badge-sub{font-size:12px;color:rgba(255,255,255,0.55)}
    .badge-btn{padding:7px 16px;border-radius:20px;background:rgba(34,197,94,0.18);border:1px solid rgba(34,197,94,0.35);color:#4ade80;font-size:12px;font-weight:600;text-decoration:none}

    .banner-card{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
    .banner-left{display:flex;align-items:center;gap:14px}
    .banner-icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:17px}
    .banner-title{font-size:14px;font-weight:700}
    .banner-sub{font-size:12px;color:rgba(255,255,255,0.55)}
    .banner-btn{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;font-size:12px;font-weight:600;text-decoration:none}

    .music-card{display:flex;align-items:center;gap:14px;padding:16px 18px}
    .music-disc{
      width:45px;
      height:45px;
      border-radius:50%;
      background:linear-gradient(135deg, #9333ea, #3b82f6);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      cursor:pointer;
      box-shadow:0 0 15px rgba(147, 51, 234, 0.4);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .music-disc.playing {
      animation: discPulse 1.2s infinite ease-in-out;
    }
    @keyframes discPulse {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(147, 51, 234, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(56, 239, 125, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 15px rgba(147, 51, 234, 0.4); }
    }

    .music-info{flex:1;min-width:0}
    .music-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .music-artist{font-size:12px;color:rgba(255,255,255,0.55);display:flex;align-items:center;gap:4px;margin-top:2px}
    .music-time{font-size:12px;color:rgba(255,255,255,0.45);font-family:monospace}
    .progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;margin-top:6px;overflow:hidden;cursor:pointer}
    .progress-fill{width:0%;height:100%;background:#a855f7;transition:width 0.05s linear}

    .audio-toggle-btn {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 999;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(20, 20, 25, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      user-select: none;
    }

    .audio-toggle-btn.playing {
      border-color: rgba(56, 239, 125, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 239, 125, 0.25);
    }

    .audio-toggle-btn:hover {
      background: rgba(35, 35, 45, 0.85);
      border-color: rgba(56, 239, 125, 0.8);
      transform: translateY(-2px) scale(1.03);
    }

    .audio-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 12px;
      width: 14px;
    }

    .audio-bar {
      width: 2.5px;
      background: #aaa;
      border-radius: 1px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .audio-toggle-btn.playing .audio-bar {
      background: #38ef7d;
      animation: soundWave 0.8s infinite ease-in-out alternate;
    }

    .audio-toggle-btn.playing .audio-bar:nth-child(1) { animation-delay: 0s; }
    .audio-toggle-btn.playing .audio-bar:nth-child(2) { animation-delay: 0.3s; }
    .audio-toggle-btn.playing .audio-bar:nth-child(3) { animation-delay: 0.15s; }

    @keyframes soundWave {
      0% { height: 3px; }
      100% { height: 12px; }
    }
  </style>
</head>
<body>
  <div class="bg-canvas">
    <div class="bg-glow" style="top:15%;left:20%"></div>
    <div class="bg-glow-2"></div>
  </div>

  <div class="intro-screen" id="introScreen" onclick="enterSite()">
    <div class="intro-text">᥊꠸ꪀ ᥴꫝꪖꪮ</div>
  </div>

  <audio id="backgroundAudio" loop preload="auto">
    <source src="Wrong Times.mp3" type="audio/mpeg">
  </audio>

  <button class="audio-toggle-btn" id="audioControl" onclick="togglePlay()">
    <div class="audio-bars">
      <div class="audio-bar"></div>
      <div class="audio-bar"></div>
      <div class="audio-bar"></div>
    </div>
    <span id="audioText">Music</span>
  </button>

  <div class="viewport">
    <div class="container" id="mainContent">
      <div class="glass-card profile-card">
        <div class="profile-top">
          <div class="profile-info">
            <div class="profile-name">
              <span id="typedName"></span><span class="typing-cursor" id="typingCursor"></span>
            </div>
            <div class="bio-text">
              你 / em <br>
              a b c d x y z n m a s a d
            </div>
          </div>
          <div class="avatar-box">
            <img class="avatar-img" src="https://raw.githubusercontent.com/p4ryx/avt/refs/heads/main/5FC8BCA4-3D03-4B99-A088-A01E818D9B28.gif"/>
          </div>
        </div>

        <div class="social-row">
          <a class="social-btn ig" href="https://www.instagram.com/cuongbeooilabeo" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
          <a class="social-btn tt" href="https://www.tiktok.com/@muadongincheon" target="_blank" rel="noopener"><i class="fab fa-tiktok"></i></a>
          <a class="social-btn fb" href="https://www.facebook.com/youngparysdasick" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i></a>
        </div>
      </div>

      <div class="glass-card badge-card">
        <div class="badge-left">
          <img class="badge-avatar" src="https://cdn.discordapp.com/attachments/1567063198262366280/1567064101388292106/IMG_0215.jpg?ex=6af017ac&is=6aeec62c&hm=0c603b69807637e0229de108de6402f4ee32a7cced9e301db29967bd4c2d8a6e&" alt="Avatar"/>
          <div class="badge-details">
            <div class="badge-title">Ron <i class="fas fa-check-circle" style="color:#3b82f6;font-size:12px"></i></div>
            <div class="badge-sub">if you.</div>
          </div>
        </div>
        <a href="https://www.github.com/p4ryx" target="_blank" rel="noopener" class="badge-btn">View Profile</a>
      </div>

      <div class="glass-card banner-card">
        <div class="banner-left">
          <div class="banner-icon"><i class="fas fa-globe"></i></div>
          <div class="banner-details">
            <div class="banner-title">nguyenthuynhan.xyz</div>
            <div class="banner-sub">Viet Nam</div>
          </div>
        </div>
        <a href="#" class="banner-btn">toideptrai.bio</a>
      </div>

      <div class="glass-card music-card">
        <div class="music-disc" id="musicDisc" onclick="togglePlay()"><i class="fas fa-play" id="playIcon" style="font-size:13px;color:#fff"></i></div>
        <div class="music-info">
          <div class="music-title" id="trackTitle"></div>
          <div class="music-artist"><i class="fas fa-volume-up" style="font-size:10px"></i> Audio Track</div>
          <div class="progress-bar" id="progressBar" onclick="seekAudio(event)"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div class="music-time" id="timeDisplay"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const audio = $('backgroundAudio');

    function updateUI(isPlaying) {
      $('playIcon').className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
      $('audioText').textContent = isPlaying ? 'Playing' : 'Muted';
      
      if(isPlaying) {
        $('audioControl').classList.add('playing');
        $('musicDisc').classList.add('playing');
      } else {
        $('audioControl').classList.remove('playing');
        $('musicDisc').classList.remove('playing');
      }
    }

    function startTypingEffect() {
      const text = "𝘕𝘨𝘶𝘺𝘦𝘯 𝘘𝘶𝘰𝘤 𝘊𝘶𝘰𝘯𝘨";
      let index = 0;
      const target = $('typedName');
      target.textContent = "";
      $('typingCursor').style.display = 'inline-block';
      
      function type() {
        if (index < text.length) {
          target.textContent += text.charAt(index);
          index++;
          setTimeout(type, 180);
        } else {
          setTimeout(() => {
            index = 0;
            target.textContent = "";
            type();
          }, 2500);
        }
      }
      type();
    }

    function formatTime(seconds){
      if(isNaN(seconds) || seconds === Infinity) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function setupTrackName(){
      const source = audio.querySelector('source');
      if(source && source.src){
        const rawName = source.src.split('/').pop().split('?')[0];
        try {
          const decoded = decodeURIComponent(rawName);
          const cleanName = decoded.replace(/\.[^/.]+$/, "");
          $('trackTitle').textContent = cleanName;
        } catch(e) {
          $('trackTitle').textContent = rawName.replace(/\.[^/.]+$/, "");
        }
      }
    }

    function enterSite(){
      setupTrackName();
      $('introScreen').classList.add('hidden');
      $('mainContent').style.display = 'flex';
      $('audioControl').style.display = 'inline-flex';
      startTypingEffect();
      audio.volume = 0.5;
      audio.play().catch(e => console.log('Autoplay blocked:', e));
    }

    function togglePlay(){
      if(!audio.paused){
        audio.pause();
      } else {
        audio.play().catch(e => console.log('Play error:', e));
      }
    }

    function seekAudio(e){
      const bar = $('progressBar');
      const rect = bar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if(audio.duration){
        audio.currentTime = pos * audio.duration;
      }
    }

    audio.onplay = () => updateUI(true);
    audio.onpause = () => updateUI(false);

    audio.onloadedmetadata = () => {
      $('timeDisplay').textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    };

    audio.ontimeupdate = () => {
      if(audio.duration){
        const pct = (audio.currentTime / audio.duration) * 100;
        $('progress').style.width = pct + '%';
        $('timeDisplay').textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      }
    };

    audio.onended = () => updateUI(false);

    document.addEventListener('DOMContentLoaded', setupTrackName);
  </script>
</body>
</html>
